name = "voxlingo-room-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Este Worker es quien posee y despliega la clase RoomDurableObject.
# El binding aqui es para que este mismo Worker pueda auto-referenciarse
# si alguna vez necesita invocarla directamente; el proyecto Pages (../wrangler.toml)
# se conecta a esta misma clase via un binding con `script_name = "voxlingo-room-worker"`.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_classes = ["RoomDurableObject"]
